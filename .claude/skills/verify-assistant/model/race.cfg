\* Replays the code before the commit check (326d565): a turn commits whatever happened to the conversation while it
\* waited on the model. The same answer sent twice then writes twice, and an answer in flight commits after a cancel
\* has dropped its question. Must fail on OneWritePerQuestion and on CancelledNeverAnswered.
SPECIFICATION Spec
CONSTANTS MaxReqs = 4 Env = TRUE Clock = TRUE Fails = TRUE Legacy = FALSE Doubt = FALSE Rivals = TRUE Unchecked = TRUE RunMax = 2 Unbounded = FALSE Intents = {"plain","cancel","uncertainPay","debtPay","debtPayNoAmount","noMatchPay","amount","amountDetail","hedgedAnswer","yes"}
INVARIANTS OneWritePerQuestion CancelledNeverAnswered
