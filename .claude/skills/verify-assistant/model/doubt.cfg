\* Replays the older replace-on-text rule (232f564, then 7f0e42f): a hedged reply, an amount with a detail or a
\* complete request replaced a pending question, so "maybe 500", "500 cash" and "Coffee 120" dropped it. Must fail on AnswerNotReplaced.
SPECIFICATION Spec
CONSTANTS MaxReqs = 4 Env = TRUE Clock = TRUE Fails = TRUE Legacy = FALSE Doubt = TRUE Rivals = FALSE Unchecked = FALSE RunMax = 2 Unbounded = FALSE Intents = {"plain","cancel","uncertainPay","debtPay","debtPayNoAmount","noMatchPay","amount","amountDetail","hedgedAnswer","yes"}
INVARIANTS AnswerNotReplaced
