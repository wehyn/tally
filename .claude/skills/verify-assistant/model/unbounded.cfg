\* Replays the code before the run limit: an open run is never ended by its length, so a turn extends a run that is already
\* at the limit and an answer or a plain prompt at an old question runs as usual. The cap at 4857caa trimmed a long run
\* instead of ending it, which is the same thing for this model, because it keeps the question and keeps going.
\* Must fail on OpenRunBounded and on ExpiryWritesNothing. TLC reports the first it reaches, so check each singly by
\* putting only its name on the INVARIANTS line.
SPECIFICATION Spec
CONSTANTS MaxReqs = 4 Env = FALSE Clock = FALSE Fails = FALSE Legacy = FALSE Doubt = FALSE Rivals = FALSE Unchecked = FALSE RunMax = 2 Unbounded = TRUE Intents = {"plain","cancel","debtPayNoAmount","amount","readOnly"}
INVARIANTS OpenRunBounded ExpiryWritesNothing
